<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Passager – Véhicules en circulation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="mapview">
    <div id="map" role="application" aria-label="Carte des véhicules en circulation"></div>
    <header class="float topbar">
      <a class="topbar__back" href="/" aria-label="Retour">‹</a>
      <div class="topbar__title"><b>Véhicules en circulation</b><span id="count" aria-live="polite">Chargement…</span></div>
      <p id="connBadge" class="badge" data-state="off">Connexion…</p>
    </header>
    <div class="fabs">
      <button id="meBtn" class="fab" type="button" aria-label="Ma position"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.9 3A9 9 0 0 0 13 3.1V1h-2v2.1A9 9 0 0 0 3.1 11H1v2h2.1A9 9 0 0 0 11 20.9V23h2v-2.1a9 9 0 0 0 7.9-7.9H23v-2h-2.1zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg></button>
      <button id="fitBtn" class="fab" type="button" aria-label="Voir tous les véhicules"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5v4h2V5h4V3H5a2 2 0 0 0-2 2zm2 10H3v4a2 2 0 0 0 2 2h4v-2H5v-4zm14 4h-4v2h4a2 2 0 0 0 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5a2 2 0 0 0-2-2z"/></svg></button>
    </div>
    <p id="empty" class="float toast" hidden>Aucun véhicule en circulation pour le moment.</p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/map-common.js"></script>
  <script src="/js/passenger.js"></script>
</body>
</html>
